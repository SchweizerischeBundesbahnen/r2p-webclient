<h3 mat-dialog-title i18n="@@header.language">Language</h3>
<mat-dialog-content class="language-modal__content">
  @for (locale of data.locales; track locale.code) {
    <button
      mat-button
      class="language-modal__item"
      [class.language-modal__item--active]="locale.code === data.currentLocale"
      (click)="select(locale.code)"
    >
      {{ locale.label }}
    </button>
  }
</mat-dialog-content>
