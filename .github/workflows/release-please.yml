name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
            app-id: ${{ secrets.R2P_APP_ID }}
            private-key: ${{ secrets.R2P_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
            token: ${{ steps.app-token.outputs.token }}
          # Note: Configuration is managed via release-please-config.json
          # and .release-please-manifest.json files

      - name: Checkout release-please branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - name: Commit and push THIRD-PARTY.txt if changed
        if: ${{ steps.release.outputs.pr }}
        run: |
          if ! git diff --quiet THIRD-PARTY.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add THIRD-PARTY.txt
            git commit -m "chore: update THIRD-PARTY.txt"
            git push
          else
            echo "THIRD-PARTY.txt unchanged, skipping commit."
          fi

  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.R2P_APP_ID }}
          private-key: ${{ secrets.R2P_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log username
        env:
          USERNAME: ${{ steps.app-token.outputs.app-slug }}
        run: echo "$USERNAME"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ steps.app-token.outputs.app-slug }}
          password: ${{ steps.app-token.outputs.token }}

      - name: Sanitize repo slug
        uses: actions/github-script@v8
        id: repo_slug
        with:
          result-encoding: string
          script: return 'ghcr.io/${{ github.repository }}'.toLowerCase()

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo_slug.outputs.result }}:${{ env.VERSION }}
            ${{ steps.repo_slug.outputs.result }}:${{ env.MAJOR }}.${{ env.MINOR }}
            ${{ steps.repo_slug.outputs.result }}:${{ env.MAJOR }}
            ${{ steps.repo_slug.outputs.result }}:latest


  build-artifact:
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.R2P_APP_ID }}
          private-key: ${{ secrets.R2P_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create archive
        run: |
          mkdir -p dist-archives
          cd dist/r2p-webclient/browser
          tar -czf ../../../dist-archives/r2p-webclient.tar.gz *
          cd ../../..
      - name: Upload to Github release
        env:
          GITHUB_token: ${{ steps.app-token.outputs.token }}
        run: gh release upload --clobber ${{ needs.release-please.outputs.tag_name }} dist-archives/r2p-webclient.tar.gz



