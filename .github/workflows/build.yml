name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check translations are in sync
        run: npm run check-translations

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests with coverage
        run: |
          set -o pipefail
          npm test -- --watch=false --coverage | tee test-results.txt

      - name: Write coverage summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 6 "Coverage summary" test-results.txt >> $GITHUB_STEP_SUMMARY || echo "Coverage data not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.txt
          if-no-files-found: error
