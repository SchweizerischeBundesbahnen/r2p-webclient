openapi: 3.0.3
info:
  title: Swagger Train - OpenAPI 3.0
  description: >-
    This is the Train based on the OpenAPI 3.0 specification. 
    You can find out more about

    Swagger at [http://swagger.io](http://swagger.io). In the third iteration of
    the pet store, we've switched to the design first approach!

    You can now help us improve the API whether it's by making changes to the
    definition itself or to the code.

    That way, with time, we can improve the API in general, and expose some of
    the new features in OAS3.
    # 260112 1.0.7 Abstract Feature and Featureset

  termsOfService: http://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.9
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: '{scheme}://{host}/{baseTrain}'
    variables:
      scheme:
        enum:
          - https
          - http
        default: https
      host:
        default: train1.swagger.io
      baseTrain:
        default: /api/v1
tags:
  - name: Train
    description: Everything about train
    externalDocs:
      description: Find out more
      url: http://swagger.io
# ---------------------------------------------- train -------------------------------------------------------------------------------------
paths:
  /train:
    put:
      tags:
        - train
      summary: Update an existing train
      description: Update an existing train by Id
      operationId: updateTrain
      requestBody:
        description: Update an existent train 
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Train'
          application/xml:
            schema:
              $ref: '#/components/schemas/Train'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Train'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid ID supplied
        '404':
          description: train not found
        '405':
          description: Validation exception
      security:
        - path_auth:
            - write:train
            - read:train
    post:
      tags:
        - train
      summary: Add a new train
      description: Add a new train
      operationId: createTrain
      requestBody:
        description: Create a new train
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Train'
          application/xml:
            schema:
              $ref: '#/components/schemas/Train'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Train'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '405':
          description: Invalid input
      security:
        - path_auth:
            - write:train
            - read:train
    get:
      tags:
        - train
      summary: Finds train
      description: one or more trains can be retrieved
      operationId: readTrain
      parameters:
        - name: trainid
          in: query
          description: Train ID for the object
          required: false
          explode: true
          schema:
            type: string
        - name: tttrefrainid
          in: query
          description: TTT RefTrain ID for the object
          required: false
          explode: true
          schema:
            type: string
        - name: tttrouteid
          in: query
          description: TTT Route ID for the object
          required: false
          explode: true
          schema:
            type: string
        - name: ttttrainid
          in: query
          description: TTT Train ID for the object
          required: false
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Train'
                  xml:
                    name: train
                xml:
                  name: trains
                  wrapped: true
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Train'
        '400':
          description: Invalid period value
      security:
        - path_auth:
            - write:train
            - read:train
# ---------------------------------------------- components -------------------------------------------------------------------------------------
# ---------------------------------------------- ---------- -------------------------------------------------------------------------------------
components:
  schemas:
# ---------------------------------------------- TRAIN -------------------------------------------------------------------------------------
    Train:
      description: >
        A train train (network slot) is SBB Infrastructure's capacity object that grants the right to operate on the network
        for a particular route and time. It is maintained by the infrastructure manager and can change during planning.
        The train train is kept separate from the Train (the RU's operational plan); combining both makes transport operationally feasible.
      type: object
      required:
        - id
        - references
        - links
        - name
        - timestamp
        - journey
      properties:
        id:
          type: string
        references:
          type: array
          xml:
            name: references
            wrapped: true
          items:
            xml:
              name: reference
            $ref: '#/components/schemas/Reference'
        links:
          description: Links to other objects e.g. URL, documents in the same GitHub-Repository
          type: array
          xml:
            name: links
            wrapped: true
          items:
            xml:
              name: link
            $ref: '#/components/schemas/Link'
        name:
          description: The name of the train.
          type: string
          example: Train for oil traffic
        startdate:
          description: The startdate of the train.
          type: string
          format: date
        weekday:
          description: The weekday of the train.
          type: string
          example: Monday
        timestamp:
          description: The update time of the train.
          type: string
          format: date-time
        journey:
          description: The journey of the train.
          $ref: '#/components/schemas/Journey'
      xml:
        name: train

# ---------------------------------------------- REFERENCES -------------------------------------------------------------------------------------
    Reference:
      description: 'The references of the object'
      type: object
      required:
        - type
        - name
      properties:
        type:
          description: type of the identifier
          $ref: '#/components/schemas/ReferenceType'
        startdate:
          description: startdate for the identifier
          type: string
          format: date
        name:
          description: name of the identifier
          type: string
          example: TR2185900000127853012025
      xml:
        name: reference
# ---------------------------------------------- LINKS -------------------------------------------------------------------------------------
    Link:
      description: |
        The links to the object

        TODO: Link weiter ausarbeiten
      type: object
      required:
        - type
        - name
      properties:
        type:
          description: type of the link
          example: doc
          $ref: '#/components/schemas/LinkType'
        name:
          description: name of the identifier
          type: string
          example: path/to/other-file.json#/Attachment/MyDocument1.docx
        notes:
          type: string
          description: description what this document is relevant for
      xml:
        name: link
# ---------------------------------------------- JOURNEY -------------------------------------------------------------------------------------
    Journey:
      description: |
        The spatial backbone of a Train/Path: an ordered sequence of
        Journeylocations that defines the route of the train run
        from origin to destination.

        The Journey describes where the train goes. The temporal
        dimension (when) is not carried at this level but is
        derived from the Timings within each Activity, anchored
        to the Train/Path's startdate.

        A Journey must contain at least two Journeylocations:
        the first element represents the origin, the last
        represents the destination. Intermediate elements are
        operational points where Activities occur (halts,
        runthroughs, crew changes, formation changes, etc.).

        The array order is semantically significant: it defines
        the spatial sequence of the train run along the
        infrastructure. This order must be consistent with the
        temporal progression of the Activities' Timings.
      type: object
      required:
        - journeylocations
        - featuresets
      properties:
        featuresets:
          description: |
            Reusable feature sets defined for this Journey. Each
            Featureset groups a combination of Features under a
            unique id and a human-readable name.

            Featuresets defined here can be referenced by
            Capabilities (via featuresetRefs) and Units (via
            featuresetRefs) anywhere within this Journey. This
            avoids redundant feature definitions when the same
            combination applies in multiple contexts.

            Example: A dangerous goods profile containing features
            for flash point, UN number, and tank code is defined
            once here and referenced by both the traction Capability
            and the payload Unit.
          type: array
          xml:
            name: featuresets
            wrapped: true
          items:
            xml:
              name: featureset
            $ref: '#/components/schemas/Featureset'
        journeylocations:
          description: |
            The ordered list of operational points that make up
            this journey. For a movement (e.g. a train run or a
            path), the first element is the origin and the last
            is the destination; the sequence defines the spatial
            route.  For a stationary activity (e.g. stabling),
            a single location with a duration is sufficient.

            Section-level properties (e.g. infrastructure
            requirements between two points) are carried on
            the departing Journeylocation and apply until the
            next Journeylocation in the array.
          type: array
          xml:
            name: journeylocations
            wrapped: true
          minItems: 1
          items: 
            xml:
              name: journeylocation
            $ref: '#/components/schemas/Journeylocation'
      xml:
        name: journey
# ---------------------------------------------- JOURNEYLOCATION -------------------------------------------------------------------------------------
    Journeylocation:
      description: |
        A node in the Journey representing a single operational
        point (station, halt, junction, handover point) where
        one or more Activities may take place.

        Journeylocations are ordered sequentially within the
        Journey array. The array position defines the spatial
        sequence of the train run - the first element is the
        origin, the last is the destination. This ordering is
        semantically significant and must be preserved.

        Each Journeylocation carries three dimensions:

        1. Location identity (locations):
          One or more Location entries identifying the same
          operational point under different coding schemes
          (e.g. SLC and UIC code for the same station). All
          entries refer to the same physical point - they are
          alternative identifiers, not distinct places.

        2. Activities (activities):
          The tasks and events occurring at this point: halts,
          runthroughs, crew changes, shunting movements,
          rolling stock assignments, inspections, etc. Each
          Activity carries its own timing, responsibility,
          capability, and requirement.

        3. Requirements (requirements):
          Aggregate constraints that the group of Activities
          of a given type at this Journeylocation must satisfy
          collectively. A Requirement can be scoped either to
          the section (from this Journeylocation to the next)
          or to the location (this point only).
          These are distinct from Activity.requirement, which
          captures conditions specific to a single Activity.
          Requirements on Journeylocation level are optional;
          the array may be empty or the field may be omitted.      
      type: object
      required:
        - locations
        - activities
      properties:
        locations:
          description: |
            One or more identifiers for the operational point
            represented by this Journeylocation. Multiple entries
            identify the same physical location under different
            coding schemes (e.g. type PLC with code 'CH-218'
            and type UIC with code '8500218' both referring to
            Biel/Bienne).
          type: array
          xml:
            name: locations
            wrapped: true
          minItems: 1
          items:
            xml:
              name: location
            $ref: '#/components/schemas/Location'
        activities:
          description: |
            The Activities taking place at this operational point.
            A Journeylocation may carry zero or more Activities.
            The execution order of Activities is determined by
            their Relations, not by their position in this array.
          type: array
          xml:
            name: activities
            wrapped: true
          items: 
            xml:
              name: activity
            $ref: '#/components/schemas/Activity'
        requirement:
          description: |
            Aggregate requirements that must be fulfilled at
            this Journeylocation (location-scoped) or on the
            section leading to the next Journeylocation
            (section-scoped).

            Unlike Activity.requirement, which is tied to a
            single Activity and its Responsible, a Requirement
            at Journeylocation level is Responsible-independent:
            it expresses what needs to be accomplished
            collectively, regardless of who provides it.

            Typical use case: a lead RU publishes a required
            capability (e.g. traction on a section) as a
            Journeylocation Requirement. Candidate partners
            then bid by attaching an Activity that satisfies
            the requirement.
          $ref: "#/components/schemas/Requirement"
      xml:
        name: journeylocation
# ---------------------------------------------- ACTIVITY -------------------------------------------------------------------------------------
    Activity:
      description: |
        The central building block of an R2P object: a discrete task or
        event that takes place at a Journeylocation. Every element
        of a R2P Object that is planned, timed, resourced, and
        assigned to a responsible party is modelled as an Activity.

        An Activity can be stationary (bound to a single location,
        e.g. a wagon inspection or a crew change) or sectional
        (beginning here and remaining in effect across subsequent
        locations until another Activity of the same type modifies
        or supersedes it, e.g. a traction assignment).

        Timings are optional. As long as an Activity is
        unscheduled, it carries no timing information. Once
        planned, timings can be absolute or relative (PDM).

        Each Activity carries:
        - type:           What happens (classified by ActivityType).
        - timings:        When it happens (optional; absolute or relative).
        - responsibility: Who is accountable for its execution.
        - capability:     What resources are provided to execute it
                          (optional; classified by CapabilityType).
        - requirement:    What conditions must be met (optional).
        - relations:      How it is temporally linked to other
                          Activities (optional; used in relative
                          timing mode following PDM).
        - alignment:      The coordination status between the
                          involved parties (optional).
        
        Each Activity carries at most one Capability. If an operational 
        task requires multiple resource types, it is decomposed into 
        separate Activities that can be linked by Relations.

        Multiple Activities can coexist at the same Journeylocation.
        Their execution order and temporal dependencies may be expressed
        through Relations, not through their position in the array.
      type: object
      required:
        - id
        - type
        - responsibility
        - timings
        - relations
      properties:
        id:
          description: |
            An identifier that uniquely identifies this activity within the context of this train/path. Other activities can reference it 
            via a relation object to express execution order and relative timing.
          type: string
        type:
          description: |
            Classifies what kind of task or event this Activity represents.
          $ref: "#/components/schemas/ActivityType"
        timings:
          description: |
            Timing constraints for this Activity. Timings are
            optional - an unscheduled Activity carries none.
            
            Two modes are supported:
            - Absolute: the reference point is the start date
              of the journey at 00:00.
            - Relative (PDM): the absolute time is derived by
              summing the durations along the shortest path
              through the relation graph back to the first
              Activity that carries an absolute timing.
          type: array
          xml:
            name: timings
            wrapped: true
          items:
            xml:
              name: timing
            $ref: '#/components/schemas/Timing'
          minItems: 0
        responsibility:
          description: |
            The party accountable for the execution of this Activity, identified by role (e.g. RRU, TRU) and organisation.
          $ref: '#/components/schemas/Responsibility'
        alignment:
          description: |
            The coordination status of this Activity between the involved parties (e.g. requested, confirmed, refused).
          $ref: '#/components/schemas/Alignment'
        capability:
          description: |
            Describes a concrete resource assignment that enables the
            execution of an Activity at a specific location (point
            capability) or from this location to a subsequent 
            location (section capability).

            Each Activity carries at most one Capability. If an operational task requires multiple resource types, 
            it is decomposed into separate Activities linked by Relations.
          $ref: '#/components/schemas/Capability'
        requirement:
          description: |
            The set of conditions that the Capability must satisfy for
            this Activity to be executed correctly and at the
            desired quality level.

            A single Requirement object groups all conditions relevant
            to this Activity. Individual conditions are expressed as
            RequirementFeatures within the Requirement, each carrying
            its own Condition (comparison operator + reference value).

            Example: A "path.runthrough" Activity on a section with
            restricted clearance may carry a Requirement containing
            two RequirementFeatures:
            - route class: conditiontype lte, reference "D4"
            - gauge profile: conditiontype eq, reference "G1"

            Both conditions must be satisfied by the corresponding
            Capability or infrastructure properties for the Activity
            to proceed.

            Requirements that apply to all Activities at a
            Journeylocation (e.g. general infrastructure constraints)
            are not placed here but in Journeylocation.requirements.
            Activity.requirement is reserved for conditions specific
            to this individual Activity.
          $ref: '#/components/schemas/Requirement'
        relations:
          description: |
            A list of relationships to other time-dependent activities to be executed sequentially. 
            Used in relative timing mode.
          type: array
          xml:
            name: relations
            wrapped: true
          items:
            xml:
              name: relation
            $ref: '#/components/schemas/Relation'
      xml:
        name: activity
# ---------------------------------------------- CAPABILITY -------------------------------------------------------------------------------------
    Capability:
      description: |
        Describes a concrete resource assignment that enables the
        execution of an Activity at a specific location (point
        capability) or from this location to a subsequent
        location (section capability).
 
        A Capability answers the question: "What is provided?" —
        in contrast to a Requirement, which answers: "What is
        needed?" The matching of Capabilities against Requirements
        determines whether an Activity can be carried out.
 
        Every Capability is classified by a CapabilityType that
        determines which resource domain is relevant and, by
        extension, which fields must be populated:
 
        - staff:        The resource is personnel. The staff array
                        must be populated with one or more Staff
                        entries. The specific role of each staff
                        member (driver, shunter, technicalInspector,
                        conductor, cleaner, catering) is defined by
                        Staff.type (StaffType).
        - rollingStock: The resource is rolling stock. The
                        rollingStock field must contain the assigned
                        vehicles (traction and/or wagons), depending
                        on the operational context.
        - path:         The resource is a network slot (train path).
        - stabling:     The resource is a stabling facility.
 
        Additional properties and limits of the provided resource
        are expressed through:
        - capabilityFeatures: individual features with optional
          restrictions (e.g. dangerous goods approval with a
          tonnage limit).
        - featuresetRefs: references (by id) to reusable Featuresets
          defined on the Journey level. This avoids redundant
          feature definitions when the same combination applies
          to multiple Capabilities or Units.
 
        Example: An Activity of type "shunting" at location Biel RB
        carries a Capability of type "staff" with a Staff entry
        of type "shunter" for the shunting team assigned to that
        yard.      
      type: object
      oneOf:
        - required: [staff]
        - required: [rollingStock]
        - required: [path]
        - required: [stabling]
      required:
        - type
        - capabilityFeatures
      properties:
        type: 
          description: |
            Classifies the type of Capability provided by a resource
            to execute an Activity.
          $ref: "#/components/schemas/CapabilityType"
        featuresetRefs:
          type: array
          description: |
            References to Featuresets defined on the Journey level.
            Each entry is the id of a Featureset from
            Journey.featuresets. The referenced Featuresets apply
            collectively to this Capability, in addition to any
            individual capabilityFeatures.

            This enables reuse: a feature combination that applies
            to multiple Capabilities or Units is defined once on
            the Journey and referenced here by id.
          xml:
            name: featuresetRefs
            wrapped: true
          items:
            type: string
            xml:
              name: featuresetRef
            example: "fs-dg-class3"
        capabilityFeatures:
          type: array
          description: List of features assigned to this capability.
          xml:
            name: capabilityfeatures
            wrapped: true
          items:
            $ref: '#/components/schemas/CapabilityFeature'
            xml:
              name: capabilityfeature
        staffs:
          type: array
          description: List of staff members associated with this capability.
          xml:
            name: staffs
            wrapped: true
          items:
            $ref: '#/components/schemas/Staff'
            xml:
              name: staff
        rollingStock:
          $ref: '#/components/schemas/RollingStock'
        path:
          $ref: "#/components/schemas/Path"
        stabling:
          $ref: "#/components/schemas/Stabling"
      xml:
        name: capability
    
# ---------------------------------------------- REQUIREMENT -------------------------------------------------------------------------------------
    Requirement:
      description: |
        Describes the set of conditions that the capabilities must meet 
        in order for an activity to be carried out correctly and to the 
        desired quality in a certain location (point requirement) or 
        from that location to the next specified location (requirement section).

        A Requirement answers the question: "What is needed?" -
        in contrast to a Capability, which answers: "What is
        provided?" An Activity can be executed when every
        Requirement is matched by a corresponding Capability
        with matching properties.

        Requirements are expressed through:
        - requirementfeatures: individual features with a
          Condition that defines the acceptance rule (e.g.
          axle load ≤ 22.5 t, gauge profile = G1, dangerous
          goods class in [3, 4.1, 8]).

        Requirements are carried at two levels in the model:
        - Activity.requirement: a requirement that is specific
          to a single Activity at a Journeylocation (e.g. a
          shunting activity requires a minimum siding length).
        - Journeylocation.requirements: requirements that apply
          to all Activities at that location or section (e.g.
          the line category of the infrastructure between two
          locations).

        Example: A section from Biel RB to Biel Mett with line
        category D4 is expressed as a Requirement with a
        RequirementFeature carrying a Condition
        (conditiontype: lte, reference: "D4") on the route
        class feature. The matching Capability on the
        RollingStock must provide a routeClass that satisfies
        this condition.
      type: object
      required:
        - capabilityFeatures
        - requirementFeatures
      properties:
        requirementFeatures:
          type: array
          description: List of features assigned to this capability.
          xml:
            name: requirementFeatures
            wrapped: true
          items:
            xml:
              name: requirementFeature
            $ref: '#/components/schemas/RequirementFeature'
      xml:
       name: requirement
# ---------------------------------------------- FEATURESET -------------------------------------------------------------------------------------
    Featureset:
      description: |
        A reusable, named set of Features that captures a specific
        combination of properties or capabilities. Featuresets are
        defined centrally on the Journey and can be referenced by
        Capabilities and Units via their id.

        The purpose of a Featureset is to avoid redundant definitions:
        a feature combination that is valid in multiple contexts
        (e.g. the same dangerous goods approval profile used by
        several Activities or Units) is defined once as a Featureset
        on the Journey and referenced wherever it applies.

        Each Featureset carries an id (unique within the Journey)
        and a human-readable name. The features array contains the
        individual Feature entries that make up the set.

        Example: A Journey for an oil transport defines a Featureset
        "fs-dg-class3" (name: "Dangerous goods class 3 profile")
        containing features for flash point, UN number, and tank
        code. Both the Capability on the traction Activity and the
        payload Unit reference this Featureset by id, ensuring
        consistency without duplication.
      type: object
      required:
        - id
        - name
        - features
      properties:
        id:
          description: |
            Uniquely identifies this Featureset within the Journey.
            Used by Capabilities and Units to reference this set
            via their featuresetRefs arrays.
          type: string
          example: "fs-dg-class3"
        name:
          description: |
            A human-readable name describing the purpose or content
            of this Featureset.
          type: string
          example: "Dangerous goods class 3 profile"
        features:
          description: |
            The list of Features that make up this set. All features
            in the set are considered to apply collectively wherever
            the Featureset is referenced.
          type: array
          xml:
            name: features
            wrapped: true
          items:
            xml:
              name: feature
            $ref: '#/components/schemas/Feature'
      xml:
       name: featureset
# ---------------------------------------------- RESTRICTION -------------------------------------------------------------------------------------
    Restriction:
      description: |
        A restriction either at the location or from this location to the next location.

        TODO: Restriction weiter ausarbeiten
      type: object
      required:
        - type
        - creator
        - creationtime
      properties:
        type:
          type: string
          example: example
        restrictedvalue:
          type: integer
          format: int64
        creator:
          type: string
          example: "thm_123"
        creationtime:
          type: string
          format: date-time
        starttime:
          type: string
          format: date-time
        endtime:
          type: string
          format: date-time
        freetext:
          type: string
          example: "reduces bistro capacity"
        resolution:
          type: string
          example: "provide water bottles"
        resolutiontime:
          type: string
          format: date-time
      xml:
        name: restriction
# ---------------------------------------------- CONDITION -------------------------------------------------------------------------------------
    Condition:
      description: |
        A condition specifies the check to be applied between two featuresets.

        TODO: Condition weiter ausarbeiten
      type: object
      properties:
        conditiontype:
          $ref: '#/components/schemas/ConditionType'
        comparetype:
          $ref: '#/components/schemas/CompareType'
        reference:
          type: string
          example: "250"
        mandatory:
          type: boolean
          example: true
      xml:
        name: condition
# ---------------------------------------------- UNIT -------------------------------------------------------------------------------------
    Unit:
      description: |
        A Unit is the universal building block for vehicle
        composition within RollingStock. It can represent two
        fundamentally different kinds of grouping:

        1. Coupled unit (Fahrzeugeinheit):
           One or more permanently coupled Carbodies that form a
           mechanical unit. Carbodies can be locomotives, wagons
           (with or without drive unit), or wagons with a driver's
           cab.
           - In passenger transport a Stadler Flirt is modelled as
             a Unit with multiple Carbodies (coaches, drive unit).
           - In freight services a single locomotive is modelled as
             a Unit with one Carbody. A permanently coupled
             multi-system locomotive (e.g. RE10 = RE420 + RE620)
             is one Unit with two Carbodies.
           - Multiple tractions that are not permanently coupled
             are modelled as separate Units, each with a single
             Carbody.
           For coupled units the carbodies array is populated and
           wagoncount is typically omitted.

        2. Formation group (Formationsgruppe / Wagengruppe):
           A logical grouping of wagons that are handled together
           operationally but are not permanently coupled. In
           wagonload freight, formation groups are assembled at
           marshalling points and transported to and from stations.
           - In block train freight (Ganzzug), the payload is
             typically one Unit representing a single formation
             group.
           - In wagonload freight (Wagenladungsverkehr), the
             payload consists of multiple Units, each representing
             a formation group that is attached or detached at
             marshalling points.
           For formation groups the id is used to track the group
           across its lifecycle (stabling, transport across
           multiple trains). The wagoncount field indicates the
           number of wagons in the group; the carbodies array may
           be empty if individual wagon details are not available.

        The id field uniquely identifies the Unit and enables
        cross-referencing across paths and trains. For formation
        groups it is the stable identifier that tracks the group
        across stabling, marshalling, and transport on one or
        more trains.
      type: object
      required:
        - id
        - carbodies
        - capabilityFeatures
        - featuresetRefs
      properties:
        id:
          description: |
            Uniquely identifies this Unit. For coupled units it
            serves as a technical identifier within the current
            RollingStock. For formation groups it is the stable
            identifier that tracks the group across its lifecycle:
            it may be parked on a stabling track, transported on a
            single train, or - as is typical in wagonload freight -
            carried across multiple trains.
          type: string
          example: "123456789012"
        name:
          description: |
            The type designator for this formation unit, such as an "RABe 523" for a Flirt unit or a "RE10" for a unit consisting of a "RE420" and a "RE620".
          type: string
          example: "RE10"
        length:
          description: |
            The length of the unit in millimetres. 
            This value may be defined at this level or derived as an aggregate by summing the buffer-to-buffer lengths 
            of all contained wagons and traction units.

            Invariant: If a value is provided at this level and values are provided at the underlying levels, 
            the value at this level must equal the aggregated value computed from the underlying values.
            At least one level (Unit or its Carbodies) must provide a value.
          type: integer
          format: int32
          example: 34110
        weight:
          description: |
            The weight of the unit in kilograms.
            This value may be defined at this level or derived as an aggregate by summing the weights 
            of all contained wagons and traction units.
            
            Invariant: If a value is provided at this level and values are provided at the underlying levels, 
            the value at this level must equal the aggregated value computed from the underlying values.
            At least one level (Unit or its Carbodies) must provide a value.
          type: integer
          format: int32
          example: 200000
        profile:
          description: |
            The Combined Transport Load Profile (KV-Ladeprofil) of this
            unit, conforming to UIC IRS 50596-6 (formerly UIC Leaflet
            596-6) and EN 13044.

            The profile encodes which intermodal loading units (ILU) —
            containers, swap bodies, or semi-trailers — may be carried
            on this unit without exceeding the permissible clearance
            envelope of the line.

            Format: a string composed of one or more profile entries
            separated by " / ". Each entry consists of:
            - A Wagon Compatibility Code (WCC): "P" (pocket wagon /
              semi-trailer), "C" (container / swap body), or "P/C" (both)
            - A space
            - A 2- or 3-digit Combined Transport Profile number (CTP no.)

            Two-digit CTP numbers (e.g. 45) apply to ISO containers
            (width 2438 mm); three-digit numbers (e.g. 362, 364) apply
            to wider units such as swap bodies or semi-trailers.

            A loaded unit may operate on a line when its CTP number does
            not exceed the CTP number published for that line (given a
            matching WCC).

            This value may be defined at this level or derived from the
            Carbody level. If values are provided at both levels they
            must be consistent.

            Normative references:
            - UIC IRS 50596-6 (coding of ILUs, wagons, and CT lines)
            - EN 13044-2 (swap body markings) / EN 13044-3 (semi-trailer
              markings)
            - SBB R G-35212, Kap. 9
          type: string
          example: "P/C 45 P 362 / C 364"
        wagoncount:
          description: |
            The number of wagons in this Unit. Primarily used
            for formation groups where the individual Carbodies
            may not be listed. For coupled units this field is
            typically omitted because the wagon count can be
            derived from the carbodies array.
          type: integer
          format: int32
          example: 5
        carbodies:
          description: |
            The list of Carbodies from which this Unit is formed.
            For coupled units (Fahrzeugeinheit) this array contains
            the permanently coupled vehicles (at least one).
            For formation groups (Wagengruppe) where individual
            wagon details are not available, this array may be
            empty; in that case wagoncount indicates the number
            of wagons in the group.
          type: array
          xml:
            name: carbodies
            wrapped: true
          items:
            $ref: '#/components/schemas/Carbody'
            xml:
              name: carbody
        capabilityFeatures:
          description: |
            The list of capability features that describe this unit.
          type: array
          xml:
            name: capabilityFeatures
            wrapped: true
          items:
            xml:
              name: capabilityFeature
            $ref: '#/components/schemas/CapabilityFeature'
        featuresetRefs:
          description: |
            References to Featuresets defined on the Journey level.
            Each entry is the id of a Featureset from
            Journey.featuresets. The referenced Featuresets apply
            collectively to this Unit, in addition to any
            individual capabilityFeatures.

            This enables reuse: a feature combination that applies
            to multiple Units or Capabilities is defined once on
            the Journey and referenced here by id.
          type: array
          xml:
            name: featuresetRefs
            wrapped: true
          items:
            type: string
            xml:
              name: featuresetRef
            example: "fs-dg-class3"
      xml:
        name: unit
# ---------------------------------------------- CARBODY -------------------------------------------------------------------------------------
    Carbody:
      description: |
        A carbody is used to depict a locomotive or wagon with or without a drive unit. 
      type: object
      required:
        - type
        - traction
        - capabilityFeatures
      properties:
        position:
          description: |
            The position of this Carbody (locomotive or wagon)
            within the overall formation. Position 1 denotes the
            first Carbody in the direction of travel, measured
            from the head of the train.
          type: integer
          format: int32
          minimum: 1
          example: 1
        type:
          description: |
            The vehicle type identifier of the carbody.
          type: string
          example: "RE420-C"
        length:
          description: |
            The buffer-to-buffer length of the carbody in millimetres.
          type: integer
          format: int32
          minimum: 1
          example: 14800
        weight:
          description: |
            The weight of the carbody in kilograms.
          type: integer
          format: int32
          minimum: 1
          example: 80000
        traction:
          description: |
            The propulsion type of this carbody. Indicates whether and how the vehicle is powered.
          $ref: '#/components/schemas/TractionType' 
        vehiclenumber:
          description: |
            The unique 12-digit European Vehicle Number (EVN) presented without formatting characters such as 
            spaces or hyphens.
          type: string
          pattern: '^\d{12}$'
          example: "918544201604"
        frontcoupling:
          description: |
            The coupling type at the front end of the carbody (in direction of travel).
          $ref: '#/components/schemas/CouplingType'
        backcoupling:
          description: |
            The coupling type at the rear end of the carbody.
          $ref: '#/components/schemas/CouplingType'
        profile:
          description: |
            The Combined Transport Load Profile (KV-Ladeprofil) of this
            carbody, conforming to UIC IRS 50596-6 (formerly UIC Leaflet
            596-6) and EN 13044.

            The profile encodes the clearance envelope of this individual
            vehicle (wagon or locomotive) when loaded with an intermodal
            loading unit (ILU). It determines which ILU types —
            containers, swap bodies, or semi-trailers — may be carried
            on this carbody without exceeding the permissible Combined
            Transport Profile of the line.

            Format: a string composed of one or more profile entries
            separated by " / ". Each entry consists of:
            - A Wagon Compatibility Code (WCC): "P" (pocket wagon /
              semi-trailer), "C" (container / swap body), or "P/C" (both)
            - A space
            - A 2- or 3-digit Combined Transport Profile number (CTP no.)

            Two-digit CTP numbers (e.g. 45) apply to ISO containers
            (width 2438 mm); three-digit numbers (e.g. 362, 364) apply
            to wider units such as swap bodies or semi-trailers.

            A loaded carbody may operate on a line when its CTP number
            does not exceed the CTP number published for that line (given
            a matching WCC).

            Normative references:
            - UIC IRS 50596-6 (coding of ILUs, wagons, and CT lines)
            - EN 13044-2 (swap body markings) / EN 13044-3 (semi-trailer
              markings)
            - SBB R G-35212, Kap. 9
          type: string
          example: example
        capabilityFeatures:
          description: |
            The list of capability features that describe this carbody.
          type: array
          xml:
            name: capabilityFeatures
            wrapped: true
          items:
            xml:
              name: capabilityFeature
            $ref: '#/components/schemas/CapabilityFeature'
      xml:
        name: carbody
# ---------------------------------------------- ROLLINGSTOCK ----------------------------------------------------------------------------
    RollingStock:
      description: |
        Describes the vehicle composition assigned to a specific activity
        within a journey. It combines traction and payload Units into a
        single formation that can be matched against infrastructure
        requirements.

        All vehicle groups - whether coupled trainsets, individual
        locomotives, or formation groups (Wagengruppen) - are
        uniformly modelled as Units. The Unit.carbodies array
        distinguishes coupled units (populated) from formation
        groups (may be empty, with wagoncount indicating group size).

        Composition rules:
        - Passenger transport: one or more Units, each representing
          a self-propelled trainset (e.g. RABe 523) or a locomotive,
          modelled as permanently coupled Carbodies.
        - Rail freight traffic: one or more Units
          for traction and multiple Units, each representing a
          formation group that is attached or detached at marshalling
          points.
        - Multiple traction: each independently operated locomotive is
          modelled as a separate Unit with a single Carbody. Only
          permanently coupled multi-system locomotives (e.g. RE10 =
          RE420 + RE620) are modelled as one Unit with multiple
          Carbodies.

        Aggregate fields (length, weight, maxSpeed) may be specified at
        this level or derived from the contained Units.
        If values are provided at both levels, the aggregate must equal
        the sum (length, weight) or minimum (maxSpeed) of the underlying
        values.
      type: object
      required:
        - units
      properties:
        length:
          description: |
            The length of the rolling stock in millimetres. 
            This value may be defined at this level or derived as an aggregate by summing the buffer-to-buffer lengths 
            of all contained wagons and traction units.

            Invariant: If a value is provided at this level and values are provided at the underlying levels, 
            the value at this level must equal the aggregated value computed from the underlying values.
          type: integer
          format: int32
          example: 415400
        weight:
          description: |
            The weight of the rolling stock in kilograms.
            This value may be defined at this level or derived as an aggregate by summing the weights 
            of all contained wagons and traction units.

            Invariant: If a value is provided at this level and values are provided at the underlying levels, 
            the value at this level must equal the aggregated value computed from the underlying values.
          type: integer
          format: int32
          example: 1284000
        maxSpeed:
          description: The max. possible speed of a train in km/h.
          type: integer
          format: int32
          example: 100
        brakeType:
          $ref: "#/components/schemas/BrakeType"
        brakeWeight:
          description: |
            Shows the braked mass of the wagon according to the type of the braking system, in kilograms.
          type: integer
          format: int32
          example: 292000
        brakingRatio:
          description: |
            Minimum percentage of braking. Expressed as a float value (no percent sign should be added).
          type: number
          format: float
          example: 76.0
        units:
          type: array
          description: |
            List of Units that make up this rolling stock. This
            includes both traction/self-propelled units (coupled
            Carbodies) and payload formation groups (Wagengruppen).
          xml:
            name: units
            wrapped: true
          items:
            $ref: '#/components/schemas/Unit'
            xml:
              name: unit
      xml:
        name: rollingStock
