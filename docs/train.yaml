# ---------------------------------------------- STAFF -------------------------------------------------------------------------------------
    Staff:
      description: |
        A staff member or staff group assigned to an Activity
        through a Capability of type "staff".
 
        The role of the staff is classified by the type field
        (StaffType), which differentiates between operational
        roles such as locomotive driver, shunter, technical
        inspector, conductor, cleaner, or catering personnel.
 
        Each Staff entry represents a single person or a named
        crew position. Multiple Staff entries within the same
        Capability indicate that several staff members are
        assigned to the same Activity.
      type: object
      required:
        - type
      properties:
        type:
          description: |
            The operational role of this staff member, classified
            by StaffType.
          $ref: '#/components/schemas/StaffType'
        capabilityfeature:
          $ref: '#/components/schemas/CapabilityFeature'        
      xml:
        name: staff
# ---------------------------------------------- TIMING -------------------------------------------------------------------------------------
    Timing:
      description: |
        A timing value expressed as an ISO 8601 duration.
        Its interpretation depends on the TimingType:
 
        Offset-based types (relative to the Train/Path's startdate):
        The duration is added to startdate to obtain the
        absolute point in time.
        Applies to: departure, arrival, earliestarrival,
        latestarrival, earliestdeparture, runthrough.
        Example: startdate = 2026-03-17, duration = P1DT12H23M
        --> 2026-03-18T12:23:00
 
        Duration-based types (length of the activity):
        The duration expresses the time span of the activity
        itself (from start to end). The absolute start and end
        times are derived from the activity's relations and
        their anchors.
        Applies to: dwelltime.
        Example: duration = PT3M → the activity lasts 3 minutes.
      type: object
      required:
        - type
        - duration
        - focus
      properties:
        type:
          $ref: '#/components/schemas/TimingType'
        duration:
          description: |
            ISO 8601 duration value. Its meaning depends on the
            TimingType of this Timing:
            - For offset-based types (departure, arrival,
              earliestarrival, latestarrival, earliestdeparture,
              runthrough): added to the Train/Path's startdate
              to compute the absolute timestamp.
              Example: P1DT14H35M with startdate 2026-03-17
              --> 2026-03-18T14:35:00
            - For duration-based types (dwelltime): the time span
              of the activity itself. The absolute start and end
              times are derived from the activity's relations.
              Example: PT3M --> activity lasts 3 minutes.
          type: string
          format: duration
          pattern: '^-?P(\d+D)?(T(\d+H)?(\d+M)?(\d+S)?)?$'
          example: 'P1DT14H35M'
        focus:
          $ref: '#/components/schemas/Focus'
        source: 
          description: |
            Identifies the origin of this timing value, i.e. the
            system, process, or method that produced it. The source
            gives an indication of the reliability of the value:
            measured or reported values (e.g. from track-side
            systems or on-board devices) are typically more
            reliable than calculated or interpolated values.

            TODO: The allowed values are not yet defined. Once
            the value range is known, this field will be replaced
            by a SourceType enum.
          type: string
      xml:
        name: timing
# ---------------------------------------------- RELATION -------------------------------------------------------------------------------------
    Relation:
      description: |
        Defines a temporal relation (Anordnungsbeziehung) between
        two activities, following the precedence diagram method (PDM).
 
        If Activity A owns a relation pointing to Activity B
        (A -> B), this means that the execution of B follows from A,
        with the exact coupling defined by the RelationType and
        an optional lag (waiting time).
 
        The RelationType anchors specify which time point of A
        is coupled to which time point of B:
        - end-start   : B starts when A ends      (B follows A)
        - start-start : B starts when A starts    (parallel start)
        - start-end   : B ends when A starts      (B before A)
        - end-end     : B ends when A ends        (parallel end)
 
        A positive lag delays B relative to the anchor; a negative
        lag (overlap) lets B occur earlier than the anchor.
 
        Example: Activity A (move.manual) has a relation of type
        end-start to Activity B (check.wagon) with lag PT5M
        -> B starts 5 minutes after A ends.
      type: object
      required:
        - activityid
        - type
      properties:
        activityid:
          type: string
          description: |
            ID of the referenced activity (B). Refers to Activity.id
            within the same Path, or in an external object
            identified by reference.
          example: 'act-journey-002'
        reference:
          description: |
            Optional. If the referenced activity belongs to a
            different Path or external object, this identifies
            that object. If omitted, the activityid refers to
            an activity within the current Path.
          $ref: '#/components/schemas/Reference'
        type:
          $ref: '#/components/schemas/RelationType'
        focus:
          description: |
            The temporal dimension this relation applies to.
            A relation may exist only in planning, or also
            in forecast/realtime. Multiple relations with
            different focus values can coexist for the same
            activity pair.
          $ref: '#/components/schemas/Focus'
        lag:
          description: |
            Waiting time (lag) between the two anchor points as
            ISO 8601 duration. A positive value delays B relative
            to the anchor of A. A negative value (prefixed with '-')
            means B's anchor occurs before A's anchor (overlap).
            If omitted, the lag is zero (no waiting time).
            Examples: PT30M = 30 min, P1DT2H = 1 day 2 hours,
            -PT10M = 10 minutes before.
          type: string
          format: duration
          pattern: '^-?P(\d+D)?(T(\d+H)?(\d+M)?(\d+S)?)?$'
          example: 'PT30M'
      xml:
        name: relation
# ---------------------------------------------- Responsibility -------------------------------------------------------------------------------------
    Responsibility:
      description: |
        Identifies the party that is accountable for the execution
        of an Activity.

        In the TAF/TAP TSI domain, multiple parties collaborate on
        a single train run. Each Activity is assigned to exactly one
        responsible party, identified by its role and organisation.
        The role determines the nature of the responsibility:

        Infrastructure side:
        - rim: Responsible Infrastructure Manager - provides the
               path and manages operational execution on the
               infrastructure side.
        - pim: Planning Infrastructure Manager - responsible for
               capacity planning and path allocation.

        Railway undertaking side:
        - ra:  Responsible Applicant - the party that holds and
               has applied for the path.
        - rru: Responsible Railway Undertaking - carries out the
               train run.
        - tru: Traction Railway Undertaking - responsible for the
               traction unit.
        - pru: Personnel Railway Undertaking - responsible for
               staffing the train.

        The status field tracks whether the responsibility
        assignment has been accepted by the designated party.
        This is distinct from Alignment.status, which tracks the
        overall coordination state of the Activity between all
        involved parties.
      type: object
      required:
        - type
        - id
        - status
      properties:
        type:
          description: |
            The role of the responsible party. Determines the
            nature of the accountability for this Activity.
          $ref: "#/components/schemas/ResponsibilityType"
        id:
          description: |
            The identifier of the responsible organisation. In
            the TAF/TAP TSI context this is typically the RICS
            code (4-digit railway company code) or the full
            party identification as used in TAF/TAP messages.
          type: string
          example: "0085"
        status:
          description: |
            The acceptance status of this responsibility
            assignment. Indicates whether the designated party
            has acknowledged and accepted the responsibility.
            Distinct from Alignment.status, which reflects the
            coordination state of the Activity as a whole.
          $ref: '#/components/schemas/PlanStatus'
      xml:
        name: responsibility
