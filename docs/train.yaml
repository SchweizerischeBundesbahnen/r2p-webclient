# ---------------------------------------------- PATH -------------------------------------------------------------------------------------
    Path:
      description: |
        A Path represents an infrastructure object of the railway infrastructure manager (IM) that grants a railway undertaking (RU) 
        the right to operate on the rail network. It defines a slot on the network — a concrete capacity on a specific route at a specific time.

        The Path specifies when and where a train service may take place, enabling conflict-free scheduling within the timetable.

        It is an independent capacity object managed by the IM: it can be requested by the RU, allocated by the IM, and adjusted 
        during the planning process (e.g. running times, technical parameters, alternative routing).
      type: object
      required:
        - id
        - length
        - weight
        - maxSpeed
      properties:
        id:
          description: |
            Uniquely identifies a path.
          type: string
          example: 50064-001
        length:
          description: |
            The calculated Length of a train (sum of all length over buffer of the wagons and traction units).  Expressed in millimetres.
          type: integer
          format: int32
          example: 165400
        weight:
          description: |
            The sum of all weights of wagons and traction units in kilograms.
          type: integer
          format: int32
          example: 384000
        maxSpeed:
          description: |
            The max. possible speed of a train in km/h.
          type: integer
          format: int32
          example: 140
        trainCategory:
          description: |
            A train category (Zugreihe) is an operational classification of trains (in particular
            freight trains) according to speed, axle loads, and braking capacity, from
            which the permissible speed on a given line is determined.

            The train category classifies the train for conflict-free path allocation
            within the timetable and is communicated to the IM as part of the path
            request. It is used by the IM to assign appropriate infrastructure slots.
          type: string
          example: "A95"
        routeClass:
          description: >
            Indication of the route class (based on CEN EN 15528: line categories for managing the interface between 
            load limits of vehicles on infrastructure). All the codes in this code list refer to CEN EN 15528: line 
            categories for managing the interface between load limits of vehicles on infrastructure.
            CM2, CM3 and CM 4 equal M2, M3 and M4 which might be used in some legacy systems which only support two character codes.
          $ref: "#/components/schemas/RouteClassType"

# ---------------------------------------------- STABLING -------------------------------------------------------------------------------------
    Stabling:
      description: |
        Describes a stabling facility assigned to an Activity through a
        Capability of type "stabling".

        A Stabling capability answers the question: "Is there a track or
        siding available to park this rolling stock?" — in terms of the
        maximum train length that can be accommodated.

        The length property defines the maximum permissible length over
        buffer of the rolling stock to be stabled. It must be at least
        as large as the actual train length (sum of all length-over-buffer
        values of traction units and wagons) to ensure the consist fits
        within the available stabling track.
      type: object
      required:
        - length
      properties:
        length:
          description: |
            Maximum permissible length over buffer of the rolling stock
            to be stabled on this facility. Expressed in millimetres.
          type: integer
          format: int32
          example: 165400
      xml:
        name: stabling

# ---------------------------------------------- API RESPONSE -------------------------------------------------------------------------------------
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
      xml:
        name: apiresponse
# ---------------------------------------------- ENUM ReferenceType -------------------------------------------------------------------------------------
    ReferenceType:
        description: |
          Specifies the type of a reference (an identifier).
          Different domains maintain their own technically and
          operationally relevant reference types, grouped below.
 
          TAF/TAP TSI domain (TTT):
          - tttReferenceTrain: Unique identifier for a Reference Train. 
              Stable identification across the entire lifecycle. 
              Data ownership lies with the RU.
          - tttRoute: RO - Unique identifier for a Route.
              Identifies the route path and RU/IM handover points. 
              Data ownership lies with the RU.
          - tttTrain: TR - Unique identifier for a Train.
              Identifies a concrete planning object "train"
              of the RU.
          - tttPath: PA - Unique identifier for a Path (network slot). 
              Assigned by the IM.
          - tttPathRequest: PR - Unique identifier for a Path Request. 
              Identifies a capacity request.
          - tttCaseReference: CR - Unique identifier for a Case (business case / dossier). 
              Used for communication between the involved partners.
 
          NeTS/FPS domain (legacy path management system of SBB Infrastructure):
          - fpsPath:  FPS path ID for unique identification of the path variant assigned by NeTS.
          - fpsDebic: FPS debtor code.
 
          TMS domain (new path management system of SBB Infrastructure):
          - plannedTrainNumber: PTN - Assigned by the RU.
              Used for planning coordination between partner railways.
          - commercialTrainNumber: CTN - Used for commercial planning and sales to 
                identify the service towards the customer.
          - infrastructureTrainNumber: ITN - Assigned by the IM.
                Used during path allocation for route planning.
          - operationalTrainNumber: OTN - Assigned by the IM.
                Used for communication with staff and systems in daily operations to 
                identify the current train on the network.

        type: string
        enum:
          - tttReferenceTrain
          - tttRoute
          - tttTrain
          - tttPath
          - tttPathRequest
          - tttCaseReference
          - fpsPath
          - fpsDebic
          - plannedTrainNumber
          - commercialTrainNumber
