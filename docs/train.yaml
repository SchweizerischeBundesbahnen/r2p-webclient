    Focus:
        description: |
          Defines the temporal dimension (layer) of a Timing value.
          A single Activity can carry multiple Timings of the same
          TimingType but with different Focus values, e.g. a planned
          departure alongside a realtime departure.
          - planning: The scheduled time as defined during the
                      timetable planning process. This is the
                      baseline and is typically set once.
          - forecast: A projected time based on current operational
                      knowledge. Updated periodically as conditions
                      change (e.g. delays, revised run times).
          - realtime: The actual observed time recorded during
                      train operation.
        type: string
        enum:
