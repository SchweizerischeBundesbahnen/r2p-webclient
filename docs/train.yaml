# ---------------------------------------------- ENUM ResponsibilityType -------------------------------------------------------------------------------------
    ResponsibilityType:
      description: |
        Defines the role of a party in relation to a path or train operation.
        - rim: Responsible Infrastructure Manager. The IM responsible for providing the path (network slot)
               and for the operational execution of the train run on the infrastructure side.
        - pim: Planning Infrastructure Manager. The IM responsible for capacity planning and path allocation.
        - ra:  Responsible Applicant. The party that holds (owns) a path and has applied for it.
        - rru: Responsible Railway Undertaking. The RU responsible for carrying out the train run.
        - tru: Traction Railway Undertaking. The RU responsible for the traction unit of the train.
        - pru: Personnel Railway Undertaking. The RU responsible for the staffing of the train.
      type: string
      enum:
        - rim
        - pim
        - ra
        - rru
        - tru
        - pru
# ---------------------------------------------- ENUM LocationType -------------------------------------------------------------------------------------
    LocationType:
      description: |
        Determines the type of the location identifyer:
        * PLC - Primary Location Code (PLC): The single, pan-European, unique identifier for an Operational Point (OP) in the TAF/TAP TSI ecosystem. 
                It is the canonical code used in TAF/TAP messages and in the Common Location Database (CLD).
        * SLC - Subsidiary Location Code (SLC): Any additional/alternate code for a PLC, coming from another coding scheme (national, sectoral, 
                commercial, legacy). Multiple SLCs can be attached to one PLC and each SLC is tagged with its coding scheme.
        * DIUM - DIUM is a UIC freight directory listing commercial freight handling points (freight stations, collection/delivery points).
                 It focuses on freight stations and designated collection/delivery points of participating railway undertakings; may also include some 
                 non-trackside customer points tied to rail freight services.
        * UIC - Operational identifier used for planning, timetables, ticketing, and interoperable messaging between railway actors (both passenger and freight). 
                It covers virtually all operational points on the rail network (passenger stops, technical points, freight yards, border points, etc.). 
      type: string
      enum:
      - PLC
      - SLC
      - DIUM
      - UIC 
      example: 'SLC'
# ---------------------------------------------- ENUM RelationType -------------------------------------------------------------------------------------
    RelationType:
        type: string
        description: |
          Defines how two activities are temporally linked,
          following the precedence diagram method (PDM).
 
          A relation is always read from the owning activity (A)
          to the referenced activity (B): "A has a relation to B"
          means B's execution follows from A according to the
          specified anchor points.
 
          The naming convention is:
            {anchor of A}-{anchor of B}
          where each anchor is either "start" or "end".
 
          - end-start:   The END of A is coupled to the START of B.
                         At lag=0 B starts immediately when A ends,
                         i.e. B follows after A.
                         This is the classic finish-to-start (FS)
                         relation.
          - start-start: The START of A is coupled to the START of B.
                         At lag=0 both activities start at the same
                         time. A positive lag means B starts later
                         than A by that amount.
                         Start-to-start (SS) relation.
          - start-end:   The START of A is coupled to the END of B.
                         At lag=0 B ends when A starts, i.e. B takes
                         place before A.
                         Start-to-finish (SF) relation.
          - end-end:     The END of A is coupled to the END of B.
                         At lag=0 both activities end at the same
                         time. A positive lag means B ends later
                         than A by that amount.
                         Finish-to-finish (FF) relation.
          - undefined:   A relation exists but the type is not
                         (yet) specified.
        enum:
          - end-start
          - start-start
          - start-end
          - end-end
          - undefined

# ---------------------------------------------- ENUM RouteClassType ---------------------------------------------------------------------------
    RouteClassType:
      description: |
        Line category according to CEN EN 15528, classifying railway
        lines by their vertical load-carrying capacity. The category
        is determined by the permissible axle load (P) and the
        permissible mass per unit length (p) of the line or line
        section.

        Standard categories for all traffic types:
        - A:   P = 16.0 t, p = 5.0 t/m
        - B1:  P = 18.0 t, p = 5.0 t/m
        - B2:  P = 18.0 t, p = 6.4 t/m
        - C2:  P = 20.0 t, p = 6.4 t/m
        - C3:  P = 20.0 t, p = 7.2 t/m
        - C4:  P = 20.0 t, p = 8.0 t/m
        - D2:  P = 22.5 t, p = 6.4 t/m
        - D3:  P = 22.5 t, p = 7.2 t/m
        - D4:  P = 22.5 t, p = 8.0 t/m

        Heavy freight categories (freight wagons only):
        - D5:   P = 22.5 t, p = 8.8 t/m
        - D4xL: P = 22.5 t, p = 8.0 t/m (extended vehicle length)
        - E4:   P = 25.0 t, p = 8.0 t/m
        - E5:   P = 25.0 t, p = 8.8 t/m
        - E6:   P = 25.0 t, p = 9.6 t/m

        Lightweight categories (multiple units, railcars):
        - a10:  P = 10.0 t
        - a12:  P = 12.0 t
        - a14:  P = 14.0 t

        Legacy national extensions (DB InfraGO):
        - CM2:  like C2 with P = 21.0 t
        - CM3:  like C3 with P = 21.0 t
        - CM4:  like C4 with P = 21.0 t
      type: string
      enum:
        # lightweight
        - a10
        - a12
        - a14
        # standard
        - A
        - B1
        - B2
        - C2
        - C3
        - C4
        - D2
        - D3
        - D4
        # heavy freight
        - D4xL
        - D5
        - E4
        - E5
        - E6
        # legacy national (DB)
        - CM2
        - CM3
        - CM4
      example: 'D4'


# ---------------------------------------------- ENUM CapabilityType ---------------------------------------------------------------------------
    CapabilityType:
      description: |
        Classifies the resource domain of a Capability provided
        to execute an Activity.
 
        - staff:        Personnel provided for the activity. The
                        specific staff role (driver, shunter, etc.)
                        is determined by Staff.type using the
                        StaffType enum.
        - rollingStock: Rolling stock assignment — the concrete
                        vehicles (traction and/or wagons) provided
                        for the activity.
        - path:         A train path (network slot) granting the
                        right to operate on the infrastructure for
                        a specific route and time.
        - stabling:     A stabling facility (siding or service
                        installation) for parking rolling stock
                        outside active service.
      type: string
      enum:
        - staff
        - rollingStock
        - path
        - stabling

# ---------------------------------------------- ENUM StaffType -------------------------------------------------------------------------------------
    StaffType:
      description: |
        Classifies the operational role of a Staff member assigned
        to an Activity via a Capability of type "staff".
 
        - driver:             Locomotive driver (Lokpersonal /
                              LPC). Responsible for operating the
                              traction unit.
        - shunter:            Shunting personnel (Rangierpersonal /
                              RCP). Responsible for coupling,
                              uncoupling, and moving vehicles within
                              a yard or station.
        - technicalInspector: Technical wagon/train inspector
                              (Technischer Kontrolleur / TKC).
                              Responsible for technical inspections
                              of rolling stock.
        - conductor:          Train attendant / conductor
                              (Zugbegleitung). Responsible for
                              on-board passenger service and safety.
        - cleaner:            Wagon cleaning personnel
                              (Wagenreinigung). Responsible for
                              interior/exterior cleaning of vehicles.
        - catering:           On-board catering personnel.
                              Responsible for food and beverage
                              service on the train.
      type: string
      enum:
        - driver
        - shunter
        - technicalInspector
        - conductor
        - cleaner
        - catering
# ---------------------------------------------- ENUM BrakeType -------------------------------------------------------------------------------------
    BrakeType:
      description: |
        Type of braking system.

        - G: "Goods" for freight services with slow application and release times
        - P: "Passenger" for passenger and freight services with quick application and release times.
        - X: an indication that brake system of the freight wagon out of order (actually / current). Additionally, X cannot be used in Planning.
        - R: a subdivision brake position of brake mode "P", for rapid (express) services with high brake performances
        - G_E: brake position G with additional brake=electro-dynamic brake
        - G_H: brake position G with additional brake=hydro-dynamic brake
        - P_E: brake position P with additional brake=electro-dynamic brake
        - P_H: brake position P with additional brake=hydro-dynamic brake
        - P_Mg: brake position P with additional brake=magnetic track brake
        - R_E: brake position R with additional brake=electro-dynamic brake
        - R_H: brake position R with additional brake=hydro-dynamic brake
        - R_Mg: brake position R with additional brake=magnetic track brake
        - R_WB: brake position R with additional brake=eddy current brake (German: Wirbelstrombremse)
        - R_E_Mg: brake position R with additional brake=electro-dynamic brake and magnetic track brake
        - R_E_WB: brake position R with additional brake=electro-dynamic brake and eddy current brake
      type: string
      enum:
        - G
        - P
        - X
        - R
        - G_E
        - G_H
        - P_E
        - P_H
        - P_Mg
        - R_E
        - R_H
        - R_Mg
        - R_WB
        - R_E_Mg
        - R_E_WB
